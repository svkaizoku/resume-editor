<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resume Editor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="toolbar">
    <span class="brand">Resume Editor</span>
    <div class="toolbar-actions">
      <button id="btn-export-pdf" type="button" title="Opens the print dialog — choose 'Save as PDF'">Export PDF</button>
      <button id="btn-export-json" type="button">Export JSON</button>
      <button id="btn-import-json" type="button">Import JSON</button>
      <input id="file-import" type="file" accept="application/json,.json" hidden />
      <button id="btn-reset" type="button" class="danger">Reset</button>
    </div>
  </header>

  <main class="layout">
    <section class="editor" id="editor" aria-label="Resume editor">
      <!-- form is rendered by app.js -->
    </section>

    <section class="preview-wrap" aria-label="Resume preview">
      <div class="preview" id="preview">
        <!-- resume is rendered by app.js -->
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
